name: project-pokemon

services:
  db:
    # El mismo motor que en producción. Ya costó una vez tener test en SQLite y la
    # aplicación en MySQL: el volcado del esquema de Solid Cache no era portable y
    # la suite dejó de arrancar de golpe.
    image: postgres:16
    environment:
      POSTGRES_DB: project_pokemon_dev
      POSTGRES_USER: andres
      POSTGRES_PASSWORD: pokemon
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andres -d project_pokemon_dev"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]
    environment:
      RAILS_ENV: development
      # La gema `config` lee estas variables y sobrescribe config/settings/development.yml
      SETTINGS__DATABASE__DB_HOST: db
      SETTINGS__DATABASE__DB_PORT: "5432"
      SETTINGS__DATABASE__DB_NAME: project_pokemon_dev
      SETTINGS__DATABASE__DB_USERNAME: andres
      SETTINGS__DATABASE__DB_SOCKET: ""
      DB_PASSWORD: pokemon
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/rails
      # Volúmenes propios del contenedor: node_modules trae binarios nativos de
      # Linux que no deben mezclarse con los del host.
      - node_modules:/rails/node_modules
      - rails_tmp:/rails/tmp
    stdin_open: true
    tty: true

volumes:
  db_data:
  node_modules:
  rails_tmp:
