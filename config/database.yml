# Los valores de conexión vienen de config/settings/<entorno>.yml (gema `config`)
# y se pueden sobrescribir por entorno con variables SETTINGS__DATABASE__*.
# La contraseña se lee de las credenciales cifradas (bin/rails credentials:edit)
# con respaldo en la variable de entorno DB_PASSWORD.
default: &default
  adapter:      <%= Settings.database.db_adapter %>
  encoding:     unicode
  pool:         <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host:         <%= Settings.database.db_host %>
  port:         <%= Settings.database.db_port %>
  database:     <%= Settings.database.db_name %>
  username:     <%= Settings.database.db_username %>
  password:     <%= Rails.application.credentials.dig(Rails.env.to_sym, :database, :db_pwd).presence || ENV["DB_PASSWORD"] %>
<% if Settings.database.db_socket.present? %>
  socket:       <%= Settings.database.db_socket %>
<% end %>

# En producción manda `DATABASE_URL`, que es lo que inyectan las plataformas de
# despliegue —Fly.io incluido— al enlazar una base de datos. Rails la usa por
# encima de estos valores, así que producción no necesita saber nada de Settings.


development:
  <<: *default

# El nombre se fija aquí y no se toma de Settings a propósito: las variables
# SETTINGS__DATABASE__* del contenedor apuntan a la base de desarrollo, y como
# Rails borra y regenera la base de test en cada ejecución, heredarlas habría
# hecho que `rails test` destruyera los datos de desarrollo.
test:
  <<: *default
  database: project_pokemon_test

production:
  <<: *default
  # Supabase no da conexión directa por IPv4 en el plan gratuito, así que hay que
  # conectarse por su pooler (Supavisor). Tiene dos modos y la diferencia importa:
  #
  #   * puerto 5432, modo sesión      → funciona sin tocar nada
  #   * puerto 6543, modo transacción → hay que apagar las sentencias preparadas
  #
  # En modo transacción, el pooler reparte la misma conexión entre peticiones y las
  # sentencias que Rails deja preparadas dejan de existir de una a otra: el error
  # que sale es un `PG::InvalidSqlStatementName` intermitente, difícil de atar a
  # esto. Con la variable a "false" se evita.
  prepared_statements: <%= ENV.fetch('DB_PREPARED_STATEMENTS', 'true') == 'true' %>
